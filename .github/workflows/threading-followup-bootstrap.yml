name: Threading followup preparation

on:
  push:
    branches: [fix/threading-resource-followup]
    paths:
      - .github/threading-followup-bootstrap.py
      - .github/workflows/threading-followup-bootstrap.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/threading-resource-followup'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Apply reviewed source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python .github/threading-followup-bootstrap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/fix/threading-resource-followup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff d15df50e6a4c20dc022f8471be9bdc0ffd21a9b9 --stat
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Compile repaired source
        run: dotnet build .\PaperTodo.csproj -c Release
